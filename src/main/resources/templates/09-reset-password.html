<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout-without-menu-bar(pageTitle=${pageTitle})}">
<head>
    <title>[[${pageTitle}]]</title>
</head>
<body>
<section layout:fragment="content">
    <div class="container-xxl py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-7">
                    <div class="card border-0 shadow-lg">
                        <div class="card-body p-4 p-lg-5">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <span class="badge bg-light text-primary">Bước 2/2</span>
                                <a th:href="@{/login}" class="text-muted small"><i class="fa fa-arrow-left me-1"></i>Quay lại đăng nhập</a>
                            </div>
                            <h4 class="mb-3">Đặt lại mật khẩu</h4>
                            <p class="text-muted">Nhập mật khẩu mới cho tài khoản của bạn.</p>

                            <div class="alert alert-danger" th:if="${errorMessage != null}" th:text="${errorMessage}"></div>

                            <form th:if="${resetPasswordForm != null}" th:action="@{/reset-password}" th:object="${resetPasswordForm}" method="post">
                                <input type="hidden" th:field="*{token}">
                                <div class="mb-3">
                                    <label class="form-label">Mật khẩu mới</label>
                                    <input type="password" class="form-control form-control-lg" th:field="*{password}" required minlength="8">
                                </div>
                                <div class="mb-4">
                                    <label class="form-label">Xác nhận mật khẩu</label>
                                    <input type="password" class="form-control form-control-lg" th:field="*{confirmPassword}" required minlength="8">
                                </div>
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary py-3">Cập nhật mật khẩu</button>
                                </div>
                            </form>

                            <div class="text-center mt-4" th:if="${resetPasswordForm == null}">
                                <a class="btn btn-primary" th:href="@{/forgot-password}">Tạo liên kết mới</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
