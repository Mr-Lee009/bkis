<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout-without-menu-bar(pageTitle='login')}">
<head>
    <title>BKIS - login</title>
    <link type="text/css" th:href="@{/css/01-app-agreement.css}" rel="stylesheet"/>
</head>

<body>
<div layout:fragment="content">
    <div class="container-xxl py-5">
        <div class="container">
            <div class="row g-5 align-items-center">
                <div class="col-lg-6">
                    <div class="wow fadeInUp" data-wow-delay="0.1s">
                        <h2 class="mb-4" th:text="#{login.manage}">Quan ly toan bo khoa hoc trong mot tai khoan</h2>
                        <p class="mb-4" th:text="#{login.track}">Theo doi tien do hoc tap, truy cap tai nguyen da mo khoa va nhan thong bao tu mentor ngay trong dashboard cua ban.</p>
                        <ul class="list-unstyled">
                            <li class="mb-3"><i class="fa fa-check text-primary me-2"></i><b th:text="#{login.sync}"></b></li>
                            <li class="mb-3"><i class="fa fa-check text-primary me-2"></i><b th:text="#{login.security}"></b></li>
                            <li class="mb-3"><i class="fa fa-check text-primary me-2"></i><b th:text="#{login.alert}"></b></li>
                        </ul>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="card border-0 shadow-lg wow fadeInUp" data-wow-delay="0.3s">
                        <div class="card-body p-4 p-lg-5">
                            <h4 class="mb-4" th:text="#{login.account}"></h4>
                            <div class="alert alert-danger d-flex align-items-start gap-2" role="alert"
                                 th:if="${errorMessage != null}">
                                <i class="fa fa-exclamation-triangle mt-1"></i>
                                <span th:text="${errorMessage}">Dang nhap khong thanh cong.</span>
                            </div>
                            <form id="loginForm" th:action="@{/login}" method="post" autocomplete="off">
                                <div class="mb-3">
                                    <label class="form-label" th:text="#{login.username}">UserName</label>
                                    <input type="text" class="form-control form-control-lg" placeholder="username" name="username" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" th:text="#{login.password}">Mật khẩu</label>
                                    <div class="position-relative">
                                        <input type="password" class="form-control form-control-lg pe-5" id="passwordInput" name="password" placeholder="••••••••" required>
                                        <button type="button" class="btn btn-link position-absolute top-50 end-0 translate-middle-y me-2 text-decoration-none" id="togglePassword"><i class="fa fa-eye"></i></button>
                                    </div>
                                </div>
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="rememberMe" name="remember-me">
                                        <label class="form-check-label" for="rememberMe" th:text="#{login.remember}"></label>
                                    </div>
                                    <a th:href="@{/forgot-password}" class="text-primary" th:text="#{login.forgot}">Quên mật khẩu?</a>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" th:text="#{login.captcha}">Captcha xac minh</label>
                                    <div class="d-flex align-items-center gap-2 mb-2 captcha-box">
                                        <img class="flex-grow-1 border rounded bg-light captcha-image" id="captchaImage"
                                             th:src="@{/captcha/image}" src="/captcha/image" alt="Captcha image"
                                             draggable="false">
                                        <button type="button" class="btn btn-outline-primary" id="refreshCaptcha" aria-label="Refresh captcha">
                                            <i class="fa fa-sync"></i>
                                        </button>
                                    </div>
                                    <input type="text" class="form-control" id="captchaInput" name="captchaAnswer"
                                           th:placeholder="#{login.placeholder.capcha}" required
                                           inputmode="text" autocapitalize="characters" spellcheck="false">
                                </div>
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary py-3" th:text="#{login.button}">Đăng nhập</button>
                                </div>
                            </form>
                            <div class="mt-4" th:if="${googleSsoEnabled or facebookSsoEnabled}">
                                <div class="d-flex align-items-center mb-3">
                                    <hr class="flex-grow-1">
                                    <span class="px-3 text-muted small">Hoặc tiếp tục với</span>
                                    <hr class="flex-grow-1">
                                </div>
                                <div class="d-grid gap-2">
                                    <a class="btn btn-outline-dark py-3"
                                       th:if="${googleSsoEnabled}"
                                       th:href="@{/oauth2/authorization/google}">
                                        <i class="fab fa-google me-2"></i>
                                        Đăng nhập với Google
                                    </a>
                                    <a class="btn btn-outline-primary py-3"
                                       th:if="${facebookSsoEnabled}"
                                       th:href="@{/oauth2/authorization/facebook}">
                                        <i class="fab fa-facebook-f me-2"></i>
                                        Đăng nhập với Facebook
                                    </a>
                                </div>
                            </div>
                            <p class="text-center text-muted mt-3 mb-0">
                                <span th:text="#{login.register}">Chưa có tài khoản?</span>
                                <a th:href="@{/register}" class="text-primary" th:text="#{login.signup}">Đăng ký ngay</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- import 01-login.js -->
    <script th:src="@{/js/01-login.js}"></script>
    <style>
        .captcha-box {
            user-select: none;
            -webkit-user-select: none;
        }

        .captcha-image {
            width: 150px;
            max-width: 100%;
            height: 46px;
            object-fit: contain;
            padding: 0.2rem 0.35rem;
        }

        #refreshCaptcha {
            padding: 0.45rem 0.7rem;
        }
    </style>
</div>
</body>

</html>
