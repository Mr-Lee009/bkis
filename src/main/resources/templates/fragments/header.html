<header class="header bg-primary text-light pt-1 fixed-top"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
        th:fragment="header(title)">
    <nav class="navbar navbar-expand-lg bg-white navbar-light shadow sticky-top p-0">
        <a th:href="@{/}" class="navbar-brand d-flex align-items-center px-4 px-lg-5">
            <h2 class="m-0 text-primary"><i class="fa fa-book me-3"></i>eLEARNING</h2>
        </a>
        <button type="button" class="navbar-toggler me-4" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarCollapse">
            <div class="navbar-nav ms-auto p-4 p-lg-0">
                <a th:href="@{/}" class="nav-item nav-link" th:classappend="${title == 'Home'} ? ' active'">Home</a>
                <a th:href="@{/#categories-section}" class="nav-item nav-link">Categories</a>
                <a th:href="@{/#courses-section}" class="nav-item nav-link" th:classappend="${title == 'Courses'} ? ' active'">Khóa học</a>
<!--                <a th:href="@{/#courses-section}" class="nav-item nav-link">Đăng ký</a>-->
                <a th:href="@{/my-courses}" class="nav-item nav-link" th:classappend="${title == 'Khóa học của bạn'} ? ' active'">Khóa học của bạn</a>
<!--                <a th:href="@{/#courses-section}" class="nav-item nav-link">Thanh toán</a>-->
<!--                <div class="nav-item dropdown">-->
<!--                    <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">Pages</a>-->
<!--                    <div class="dropdown-menu fade-down m-0">-->
<!--                        <a th:href="@{/#java-courses-section}" class="dropdown-item">Java Courses</a>-->
<!--                        <a th:href="@{/#testimonial-section}" class="dropdown-item">Testimonial</a>-->
<!--                        <a th:href="@{/login}" class="dropdown-item">Login</a>-->
<!--                    </div>-->
<!--                </div>-->
                <a th:href="@{/#contact-section}" class="nav-item nav-link">Contact</a>
            </div>
            <a sec:authorize="isAnonymous()" th:href="@{/#courses-section}" class="btn btn-primary py-4 px-lg-5 d-none d-lg-block">Join Now<i class="fa fa-arrow-right ms-3"></i></a>
            <div sec:authorize="isAuthenticated()"
                 th:with="currentUser=${#authentication.principal.user},
                          displayName=${#strings.isEmpty(#authentication.principal.user.fullName) ? (#strings.isEmpty(#authentication.principal.user.username) ? #authentication.principal.user.email : #authentication.principal.user.username) : #authentication.principal.user.fullName},
                          avatarUrl=${#authentication.principal.user.profilePictureUrl},
                          avatarInitial=${#strings.isEmpty(displayName) ? 'U' : #strings.substring(displayName, 0, 1)}"
                 class="nav-item dropdown border-start bg-white me-lg-3">
                <button class="btn d-flex align-items-center gap-2 px-3 py-3 dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <img class="rounded-circle border"
                         th:if="${!#strings.isEmpty(avatarUrl)}"
                         th:src="${avatarUrl}"
                         th:alt="${displayName}"
                         style="width: 42px; height: 42px; object-fit: cover;">
                    <span class="rounded-circle bg-primary text-white d-inline-flex align-items-center justify-content-center"
                          th:if="${#strings.isEmpty(avatarUrl)}"
                          style="width: 42px; height: 42px;"
                          th:text="${avatarInitial}">U</span>
                    <span class="d-none d-xl-flex flex-column text-start lh-sm">
                        <strong class="text-dark small" th:text="${displayName}">User Name</strong>
                        <small class="text-muted" th:text="${currentUser.email}">user@example.com</small>
                    </span>
                </button>
                <div class="dropdown-menu dropdown-menu-end shadow border-0 rounded-3 mt-2" style="min-width: 270px;">
                    <div class="px-3 py-3 bg-primary text-white">
                        <strong class="d-block" th:text="${displayName}">User Name</strong>
                        <small th:text="${currentUser.email}">user@example.com</small>
                    </div>
                    <a class="dropdown-item py-2" th:href="@{/my-courses}">
                        <i class="fa fa-book-open text-primary me-2"></i>Khóa học của bạn
                    </a>
                    <a class="dropdown-item py-2" href="#">
                        <i class="fa fa-receipt text-primary me-2"></i>Lịch sử thanh toán
                    </a>
                    <div class="dropdown-divider"></div>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="dropdown-item py-2 text-danger">
                            <i class="fa fa-sign-out-alt me-2"></i>Đăng xuất
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>
</header>
