spring.application.name=bkis
spring.profiles.active=dev

# Server port
server.port=8888

# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:3306/bkis_edu?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Multiple languages
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.web.locale-resolver=fixed

# Config upload file
spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=150MB

# Remember-me cookie
app.security.remember-me.key=bkis-remember-me-fixed-key
app.security.remember-me.validity-seconds=1209600

# SSO button visibility on the login page
app.security.sso.google-enabled=false
app.security.sso.facebook-enabled=false

# Google OAuth2 configuration
spring.security.oauth2.client.registration.google.client-id=bkis-google-client-id
spring.security.oauth2.client.registration.google.client-secret=bkis-google-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email

