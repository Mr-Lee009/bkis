spring.application.name=bkis
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Multiple languages
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Upload cleanup
app.upload.temp-ttl-minutes=120
app.upload.cleanup.fixed-delay-ms=1800000

# Signed URL video noi bo
app.video.signing-secret=bkis-video-secret-key-change-me
app.video.signed-url-valid-minutes=60
app.video.storage-root=uploads



