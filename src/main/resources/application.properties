spring.application.name=bkis

# Server port
server.port=8888

# MySQL datasource
# You can override these via environment variables:
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
#spring.datasource.url=${SPRING_DATASOURCE_URL}
#spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
#spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.url=jdbc:mysql://localhost:3310/bkis_edu?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Multiple languages
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.web.locale-resolver=accept-header

# Config upload file
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Remember-me cookie
app.security.remember-me.key=bkis-remember-me-key-change-me
app.security.remember-me.validity-seconds=2592000

# SSO button visibility on the login page
app.security.sso.google-enabled=false
app.security.sso.facebook-enabled=false

