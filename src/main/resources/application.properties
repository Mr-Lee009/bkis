spring.application.name=bkis
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server port
server.port=${SERVER_PORT}

# MySQL datasource
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM}

# Multiple languages
spring.messages.basename=${SPRING_MESSAGES_BASENAME}
spring.messages.encoding=${SPRING_MESSAGES_ENCODING}
spring.web.locale-resolver=${SPRING_WEB_LOCALE_RESOLVER}

# Config upload file
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE}

# Remember-me cookie
app.security.remember-me.key=${APP_SECURITY_REMEMBER_ME_KEY}
app.security.remember-me.validity-seconds=${APP_SECURITY_REMEMBER_ME_VALIDITY_SECONDS}

# SSO button visibility on the login page
app.security.sso.google-enabled=${APP_SECURITY_SSO_GOOGLE_ENABLED}
app.security.sso.facebook-enabled=${APP_SECURITY_SSO_FACEBOOK_ENABLED}

# Google OAuth2 configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=${GOOGLE_OAUTH_SCOPE}

