# Cau hinh prod doc tu bien moi truong tren server.

# Server port
server.port=${SERVER_PORT}

# MySQL datasource
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM}

# Multiple languages
spring.web.locale-resolver=${SPRING_WEB_LOCALE_RESOLVER:accept-header}

# Config upload file
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE}

# Remember-me cookie
app.security.remember-me.key=${APP_SECURITY_REMEMBER_ME_KEY}
app.security.remember-me.validity-seconds=${APP_SECURITY_REMEMBER_ME_VALIDITY_SECONDS}

# SSO button visibility on the login page
app.security.sso.google-enabled=${APP_SECURITY_SSO_GOOGLE_ENABLED:true}
app.security.sso.facebook-enabled=${APP_SECURITY_SSO_FACEBOOK_ENABLED:false}

# Google OAuth2 configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=${GOOGLE_OAUTH_SCOPE:openid,profile,email}

# Facebook OAuth2 sample configuration
# spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
# spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
# spring.security.oauth2.client.registration.facebook.scope=email,public_profile

# B?t tính n?ng g?p câu l?nh insert thành m?t c?m duy nh?t (c?c k? quan tr?ng cho MySQL)
spring.jpa.properties.hibernate.jdbc.batch_size=5000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# T?t t? ??ng phát hi?n/ki?m tra select tr??c khi insert (gi?m t?i truy v?n th?a)
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.hbm2ddl.auto=update

# T?i ?u hóa b? nh? cache n?i b? c?a Hibernate
spring.jpa.properties.hibernate.id.new_generator_mappings=true