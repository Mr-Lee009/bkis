# Cau hinh dev dung truc tiep cho moi truong local.

# Server port
server.port=8888

# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:3306/bkis_edu?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=bkis_user
spring.datasource.password=bkis_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Multiple languages
spring.web.locale-resolver=fixed

# Config upload file
spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=150MB

# Remember-me cookie
app.security.remember-me.key=bkis-dev-remember-me-key
app.security.remember-me.validity-seconds=1209600

# SSO button visibility on the login page
app.security.sso.google-enabled=true
app.security.sso.facebook-enabled=false

# Google OAuth2 configuration
spring.security.oauth2.client.registration.google.client-id=345489475262-k2pch61irflafqne8ijploujtaje3kll.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=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bkis-google-client-secret
